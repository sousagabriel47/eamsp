<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EAMSP · Gestão da equipe</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#0B7A64;--gd:#065A4E;--o:#D3572A;--bg:#fff;--soft:#F1F7F2;--tx:#14261A;--mu:#5B6B60;--ln:#D6E3D9;--bad:#C0392B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#3DB160;--gd:#0E2A17;--o:#FF8A3D;--bg:#0F1A13;--soft:#16261C;--tx:#EAF3EC;--mu:#9DB2A3;--ln:#27402F;--bad:#FF7A6B}}
:root[data-theme="dark"]{--g:#3DB160;--gd:#0E2A17;--o:#FF8A3D;--bg:#0F1A13;--soft:#16261C;--tx:#EAF3EC;--mu:#9DB2A3;--ln:#27402F;--bad:#FF7A6B}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Barlow,system-ui,sans-serif}
header{background:var(--gd);color:#fff;padding:18px 16px 0;border-bottom:5px solid var(--o)}
.wrap{max-width:900px;margin:0 auto}
h1{font:700 34px/1 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.5px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:12px}.brand img{border-radius:50%;flex:none}header p{margin:4px 0 0;opacity:.85;font-size:14px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:transparent;border:0;color:#fff;opacity:.75;font:600 16px Barlow,sans-serif;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{opacity:1;border-color:#fff;background:rgba(255,255,255,.1)}
main{padding:16px}
h2{font:700 24px 'Barlow Condensed',sans-serif;margin:0 0 10px}
.alerts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.al{padding:8px 12px;border-left:4px solid var(--o);background:var(--soft);font-size:14px}
.al.bad{border-color:var(--bad)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;background:var(--soft);padding:12px;margin-bottom:16px;border-top:3px solid var(--g)}
label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
input,select{font:inherit;padding:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:4px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--o);outline-offset:1px}
.btn{background:var(--o);color:#fff;border:0;font:600 15px Barlow,sans-serif;padding:9px 14px;border-radius:4px;cursor:pointer;align-self:end}
.btn.s{padding:5px 10px;font-size:13px}.btn.g{background:var(--g)}.btn.x{background:transparent;color:var(--mu);border:1px solid var(--ln)}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.item>.info{flex:1;min-width:180px}.item b{display:block}.item small{color:var(--mu)}
.date{width:58px;text-align:center;background:var(--g);color:#fff;padding:4px 0;font:700 26px/1 'Barlow Condensed',sans-serif}
.date small{display:block;color:#fff;font:600 12px Barlow;opacity:.9}
.mes{font:700 15px 'Barlow Condensed';color:var(--o);letter-spacing:.5px;margin:18px 0 0;text-transform:uppercase}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);border:1px solid var(--g);color:var(--g)}
.tag.w{border-color:var(--o);color:var(--o)}.tag.b{border-color:var(--bad);color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--mu);padding:20px 0}
.sum{font-weight:600;margin:0 0 8px;color:var(--mu)}
.tools{margin-left:auto}.tools button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:4px 10px;font:500 13px Barlow,sans-serif;cursor:pointer}.brand{flex-wrap:wrap}</style></head><body>
